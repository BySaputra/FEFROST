<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEFROST Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <script type="module" src="app.js"></script>
</head>
<body>

  <h1>FEFROST Monitoring</h1>

  <div class="card">
    <h2>Room Temperature</h2>
    <p id="temp-room">-- °C</p>
  </div>

  <div class="card">
    <h2>Humidity</h2>
    <p id="humidity">-- %</p>
  </div>

  <div class="card">
    <h2>Storage Temperature</h2>
    <p id="temp-storage">-- °C</p>
  </div>

  <div class="card">
    <h2>Status</h2>
    <p id="status">--</p>
  </div>

</body>
</html>
